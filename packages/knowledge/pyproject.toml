[project]
name = "citadel-knowledge"
version = "0.0.0"
description = "Ingestion, hybrid retrieval, reranking, citations."
requires-python = ">=3.12"

# The dependency rule from the root AGENTS.md, declared so it is enforced at
# install time and not only by a test.
# MUST NOT be imported by runtime. Retrieval is the docs.* tools.
dependencies = [
    "citadel-contracts",
    "citadel-platform",
    "citadel-gateway",
    "pdfplumber>=0.11,<1",
    "pypdfium2>=4.30,<6",
    "pillow>=10.4,<13",
    "pytesseract>=0.3.10,<1",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0,<7",
]

# uv_build ships with uv, so building this package needs no network.
# setuptools would have to be fetched from PyPI for every build, which
# breaks the offline-build requirement (handoff 3.2). See PLAN-M0 task 14.
[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"


[tool.uv.sources]
citadel-contracts = { workspace = true }
citadel-platform = { workspace = true }
citadel-gateway = { workspace = true }
