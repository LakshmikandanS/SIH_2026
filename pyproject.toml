[project]
name = "citadel"
version = "0.0.0"
description = "Sovereign on-premise agentic AI workbench for confidential industrial work"
requires-python = ">=3.12"
dependencies = [
    "citadel-contracts",
    "citadel-platform",
    "citadel-gateway",
    "citadel-knowledge",
    "citadel-memory",
    "citadel-tools",
    "citadel-runtime",
    "citadel-deliverables",
    "citadel-sovereignty",
    "citadel-api",
    "citadel-worker",
    "citadel-sandbox",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.workspace]
members = ["packages/*", "services/api", "services/worker", "services/sandbox"]

[tool.uv.sources]
citadel-contracts    = { workspace = true }
citadel-platform     = { workspace = true }
citadel-gateway      = { workspace = true }
citadel-knowledge    = { workspace = true }
citadel-memory       = { workspace = true }
citadel-tools        = { workspace = true }
citadel-runtime      = { workspace = true }
citadel-deliverables = { workspace = true }
citadel-sovereignty  = { workspace = true }
citadel-api          = { workspace = true }
citadel-worker       = { workspace = true }
citadel-sandbox      = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services"]
# --strict-markers: a mistyped marker should fail, not silently register as a new one.
#
# --import-mode=importlib: every package's tests/ has no __init__.py (see the mypy
# override comment below for why), which means more than one test directory in this
# workspace is a bare `tests/` -- and, without this flag, pytest's default import mode
# inserts each test directory onto sys.path and imports its files by bare module name,
# so packages/contracts/tests/test_receipts.py and packages/platform/tests/ colliding
# on the shared parent name "tests" produces a real, empirically-confirmed collection
# error ("No module named 'tests.test_registry_loader'") the moment a second package
# gets a populated tests/ directory -- not a hypothetical. importlib mode imports each
# file by its actual filesystem path instead, so same-named *directories* never
# collide. It does not relax the need for globally-unique *file basenames* across the
# whole repo -- two files named identically would still collide -- which is exactly
# why tests/structural/test_contracts_import_boundary.py is named differently from
# packages/contracts/tests/test_contracts_is_self_contained.py (packages/contracts/AGENTS.md).
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: no database, no GPU, no network",
    "integration: touches Postgres or a running service",
    "structural: architectural boundary enforcement",
]
# tests/structural/*.py do `from conftest import ...`, and packages/platform/tests/
# does `from pg_scratch import ...` -- a plain top-level import of shared test
# helpers in both cases, not pytest's fixture-injection mechanism, and not a
# package-relative import (neither directory has an __init__.py, on purpose -- see
# the mypy override comment below). --import-mode=importlib deliberately stops
# inserting a test file's own directory onto sys.path (that insertion is what caused
# the cross-package "tests" collision it was turned on to fix), so without this,
# these bare imports stop resolving under importlib mode. Putting each directory on
# sys.path directly, independent of import mode, is the fix: these are specific,
# individually-listed directories, not every test directory, so it does not
# reintroduce the collision. pg_scratch.py is deliberately not named conftest.py --
# see that file's own docstring for why a second conftest.py doesn't work here.
pythonpath = ["tests/structural", "packages/platform/tests", "tests/fakes"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

# Test functions are `def test_x():`, never `def test_x() -> None:` -- that is pytest's
# own idiom, not sloppiness, and requiring the annotation on every test function is
# noise strict mode elsewhere earns its keep by NOT producing. The same idiom covers
# two shapes `disallow_untyped_defs` alone does not reach, both first exercised by
# packages/tools/tests/test_policy.py: a fixture consumed by type-annotated parameter
# (`def test_x(registry: Registry):` -- params given, return type deliberately not,
# since it's still `-> None` pytest never writes) is "incomplete", not "untyped", so
# it needs `disallow_incomplete_defs` too; and a *parenthesized* `@pytest.fixture(
# scope="module")` (needed here because reloading the real registry from YAML in
# every single test is real, measurable waste a module-scoped fixture avoids -- not
# decoration) resolves through a less-precise overload than bare `@pytest.fixture`,
# which trips `disallow_untyped_decorators` on the decorated function even though
# that function's own return type is fully annotated. Confirmed empirically: this is
# not a hypothetical pair of flags added defensively, it is the exact diagnosis of
# the 19 mypy errors test_policy.py produced with only `disallow_untyped_defs` set.
#
# No tests/ directory anywhere in this repo has an __init__.py (see the
# --import-mode=importlib comment above: two packages' tests/ both being bare `tests`
# is what broke pytest, and the identical shape breaks mypy too -- "Duplicate module
# named 'tests'" -- the moment two are type-checked in the same invocation, which is
# confirmed, not hypothetical, since packages/platform/tests/ started existing).
# Consistently no __init__.py, everywhere, means every test file resolves as its own
# bare top-level module name -- never a dotted one -- so this override lists each one
# individually rather than a package-qualified glob. mypy's override `module` patterns
# only allow a WHOLE component to be `*`; `test_*` (a literal prefix glued to a
# wildcard within one component) is invalid syntax and is silently dropped by mypy with
# a warning, not an error. A bare `*` isn't a safe substitute either: since
# packages/contracts/src/citadel_contracts has no parent __init__.py, `citadel_contracts`
# itself (from its own __init__.py) is ALSO a single-component module name, and `*`
# would relax disallow_untyped_defs for real source right along with the tests.
#
# Add the new file's module name here whenever a test file is added anywhere in the
# repo -- tests/structural/AGENTS.md's own checklist repeats this for detectors, and
# the same applies to every packages/*/tests/test_*.py.
[[tool.mypy.overrides]]
module = [
    "test_contracts_import_boundary",
    "test_identity_not_from_body",
    "test_inference_isolation",
    "test_module_boundaries",
    "test_no_egress",
    "test_no_external_urls_in_build",
    "test_no_hardcoded_models",
    "test_no_string_classification_compare",
    "test_profile_ceiling_enforced_at_ingest",
    "test_single_chokepoint",
    "test_classification",
    "test_contracts_is_self_contained",
    "test_domain",
    "test_envelopes",
    "test_events",
    "test_identity",
    "test_receipts",
    "test_state_machines",
    "test_registry_loader",
    "test_migrations_runner",
    "test_audit_chain",
    "test_audit_chain_schema",
    "test_audit_chain_postgres",
    "test_vector_iterative_scan",
    "test_identity_keys",
    "test_identity_seed",
    "test_policy",
    "test_psql_client",
    "test_identity_store",
    "test_db",
    "test_gateway_routing",
    "test_knowledge",
    "test_deliverables",
    "test_chokepoint",
    "test_sovereignty",
    "test_agent",
    "test_api",
    "test_sandbox_service",
    "test_worker_seed",
    "test_image_contents",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

# PyYAML ships no inline types and no first-party stub package mypy can find in this
# workspace (types-PyYAML exists, but network is required to install it -- see the
# sandbox-tooling note above -- and the copy bundled inside pyright's own typeshed
# fallback is not something mypy can be pointed at). --ignore-missing-imports does not
# cover this: that flag suppresses "module not found" (import-not-found), and PyYAML
# *is* found -- it just has no types, which is the distinct import-untyped error this
# override silences, specifically for this one library rather than repo-wide.
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

# The same import-untyped gap as PyYAML above, for the document, OCR and telemetry
# libraries the knowledge, deliverables and sovereignty packages use: none of these
# ships a py.typed marker (python-docx, pdfplumber, Pillow and httpx do, and are
# type-checked for real). Scoped to exactly these modules, never repo-wide.
[[tool.mypy.overrides]]
module = [
    "openpyxl", "openpyxl.*",
    "lxml", "lxml.*",
    "pytesseract", "pytesseract.*",
    "pypdfium2", "pypdfium2.*",
    "psutil", "psutil.*",
    "jsonschema", "jsonschema.*",
]
ignore_missing_imports = true
