# Citadel on one box (ADR-0004): Postgres + pgvector, the API (with the web UI), the
# worker, and the sandbox -- with Ollama running natively on the host, where it has the
# GPU. Started by citadel.cmd (Windows) or scripts/up.sh (Linux/WSL2).
#
# Enforcement, in the order a packet would meet it:
#   * postgres and sandbox sit ONLY on internal networks: no gateway, no route out.
#   * api and worker additionally sit on `host_link`, which they need for exactly two
#     things -- the browser reaching the API on 127.0.0.1, and the worker/API reaching
#     Ollama on the host -- and a default-deny nftables ruleset in each of their own
#     network namespaces (ops/compose/egress-entrypoint.sh) allows nothing else out,
#     and refuses any connection the sandbox network tries to open to them.
#   * the in-process fence and the telemetry run inside every Python process.
#
# Docker Desktop (citadel.cmd) or Docker Engine in a WSL2 distro (scripts/up.sh) run this
# file unchanged; the rules live in the containers, not on the host (docs/adr/0006).
#
# The subnets are fixed so the ruleset can name them; change them here (and only here)
# if they collide with a network on your machine.

name: citadel

x-app-env: &app-env
  CITADEL_PROFILE: demo-local
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: citadel
  PGPASSWORD: ${CITADEL_DB_PASSWORD:-citadel-local-only}
  PGDATABASE: citadel
  CITADEL_KEYS_DIR: /keys
  CITADEL_DATA_DIR: /data
  CITADEL_INFERENCE_ENDPOINT: ${CITADEL_INFERENCE_ENDPOINT:-http://host.docker.internal:11434}
  CITADEL_SANDBOX_URL: http://sandbox:8090
  CITADEL_EGRESS_NETWORKS: 172.30.10.0/24,172.30.20.0/24
  # The sandbox network may answer the api/worker, never call them: code that escaped
  # the sandbox finds every port on them refused (docs/adr/0007).
  CITADEL_UNTRUSTED_NETWORKS: 172.30.20.0/24
  CITADEL_ENFORCEMENT_FILE: /run/citadel/enforcement.json
  CITADEL_ORG_NAME: ${CITADEL_ORG_NAME:-Citadel demonstration plant}
  CITADEL_REQUIRE_ENFORCEMENT: ${CITADEL_REQUIRE_ENFORCEMENT:-0}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: citadel
      POSTGRES_PASSWORD: ${CITADEL_DB_PASSWORD:-citadel-local-only}
      POSTGRES_DB: citadel
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citadel -d citadel"]
      interval: 3s
      timeout: 3s
      retries: 40

  init:
    build: { context: ../.., dockerfile: ops/compose/Dockerfile }
    image: citadel:local
    command: ["/app/ops/compose/init.sh"]
    environment: *app-env
    volumes:
      - keys:/keys
      - citadel-data:/data
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  sandbox:
    image: citadel:local
    pull_policy: never   # built by `init` from this repository; there is nothing to pull
    command: ["python", "-m", "citadel_sandbox"]
    user: "10002:10002"
    restart: unless-stopped
    environment:
      CITADEL_KEYS_DIR: /keys
      CITADEL_SANDBOX_KIND: container
      CITADEL_SANDBOX_PORT: "8090"
    volumes:
      - keys:/keys:ro
    networks: [sandbox]
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      init: { condition: service_completed_successfully }

  worker:
    image: citadel:local
    pull_policy: never   # built by `init` from this repository; there is nothing to pull
    entrypoint: ["/app/ops/compose/egress-entrypoint.sh"]
    command: ["python", "-m", "citadel_worker"]
    restart: unless-stopped
    environment:
      <<: *app-env
      CITADEL_SEED_CORPUS: "1"
      CITADEL_WORKERS: "3"
    volumes:
      - keys:/keys:ro
      - citadel-data:/data
    networks: [data, sandbox, host_link]
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    # Held only by egress-entrypoint.sh while it installs the ruleset and drops to uid
    # 10001 with an EMPTY bounding set (SETPCAP is what lets it empty that set); the
    # application itself runs with no capabilities and no_new_privs.
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    depends_on:
      init: { condition: service_completed_successfully }
      sandbox: { condition: service_started }

  api:
    image: citadel:local
    pull_policy: never   # built by `init` from this repository; there is nothing to pull
    entrypoint: ["/app/ops/compose/egress-entrypoint.sh"]
    command: ["python", "-m", "citadel_api"]
    restart: unless-stopped
    environment:
      <<: *app-env
      CITADEL_API_HOST: 0.0.0.0
      CITADEL_API_PORT: "8000"
    volumes:
      - keys:/keys:ro
      - citadel-data:/data
    ports:
      - "127.0.0.1:${CITADEL_PORT:-8000}:8000"
    networks: [data, sandbox, host_link]
    extra_hosts: ["host.docker.internal:host-gateway"]
    cap_drop: [ALL]
    # Held only by egress-entrypoint.sh while it installs the ruleset and drops to uid
    # 10001 with an EMPTY bounding set (SETPCAP is what lets it empty that set); the
    # application itself runs with no capabilities and no_new_privs.
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8000, timeout=3); c.request('GET', '/api/health'); raise SystemExit(c.getresponse().status != 200)"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      init: { condition: service_completed_successfully }
      sandbox: { condition: service_started }

networks:
  data:
    internal: true
    ipam: { config: [{ subnet: 172.30.10.0/24 }] }
  sandbox:
    internal: true
    ipam: { config: [{ subnet: 172.30.20.0/24 }] }
  host_link:
    ipam: { config: [{ subnet: 172.30.30.0/24 }] }

volumes:
  pgdata:
  keys:
  citadel-data:
