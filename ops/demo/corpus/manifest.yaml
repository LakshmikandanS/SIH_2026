# The seeded demonstration corpus (ops/demo/make_corpus.py generates the files).
#
# Every entry declares classification and ACL explicitly -- the seed path goes through
# the same upload validation as a human upload, and that path rejects anything that
# does not. `uploaded_by` is one of migration 0006's identities, and each document is
# within its uploader's clearance, with the uploader's department in its ACL.
#
# `folder` files a document in the workbench's resources tree (a place, not a
# permission: who may read a document is its classification and ACL, wherever it sits).
# `version_of: <key>` files a later issue of an earlier entry as version 2 of the same
# document, so its history and a diff between issues are real (Policy 1, below).
#
# Who sees what for a query like "E-101 corrosion" (ADR-0001 §Q7):
#   demo-engineer-1  internal, process-engineering  -> IR-0147, P-310, CS-12, nameplate
#                    denied: INC-0092 (classification), UT-0311 (classification + ACL)
#   demo-engineer-2  confidential, instrumentation  -> IR-0147, UT-0311, PT-4471, CS-12, nameplate
#                    denied: INC-0092 (ACL), P-310 (ACL)
#   demo-approver    confidential, quality-assurance -> IR-0147, UT-0311, INC-0092, CS-12, nameplate
#
# And for the lathe scenario (a report on lathe L-1):
#   demo-engineer-1  sees the policies, the machine shop and the requisition, and the
#                    reference library; the vendor quotation comparison is withheld
#                    (classification)
#   demo-engineer-2  is refused the machine shop and procurement records (ACL)
#   demo-approver    sees everything, the quotation comparison included

