# Tool manifest. Tools are declarative plugins discovered from this file.
#
# Adding a tool must NEVER require editing the agent loop. If it does, the loop is
# dispatching on tool names — the named failure mode in the root AGENTS.md.
#
# side_effect:  read | write | execute      (drives policy and receipt requirements)
# classification_ceiling: the highest classification this tool may ever touch.
# One of PUBLIC, INTERNAL, CONFIDENTIAL (citadel_contracts.classification.Classification)
# -- "restricted" was never a real level and was a registry bug, fixed here the same
# way as the identical bug in models.demo-local.yaml. The split that remains is real,
# not an oversight: docs.search, docs.read, vision.extract and doc.generate touch the
# confidential corpus directly and are capped at CONFIDENTIAL; fs.*, sheet.* and code.run
# only ever touch task-workspace scratch files or sandboxed execution, never the source
# corpus, and stay capped at INTERNAL -- least privilege, not a limitation anyone forgot
# to lift. calc.evaluate is capped at CONFIDENTIAL; its own entry says why.

tools:
  - name: docs.search
    description: "Search the organisation's own permitted records (policies, reports, logs); returns passages with evidence ids to cite."
    package: citadel_tools.docs
    side_effect: read
    required_capabilities: [retrieval]
    classification_ceiling: confidential
    requires_receipt: true            # data boundary
    options:
      outside_folder: REFERENCE_LIBRARY   # external literature is web.search's, not the company record's
    schema:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:  { type: string, minLength: 1 }
        top_k:  { type: integer, minimum: 1, maximum: 50, default: 8 }

  - name: docs.read
    description: "Read one page of a document (document_id from search results; version to read an earlier issue); returns its blocks, evidence ids and the list of issues."
    package: citadel_tools.docs
    side_effect: read
    required_capabilities: [retrieval]
    classification_ceiling: confidential
    requires_receipt: true
    schema:
      type: object
      required: [document_id]
      additionalProperties: false
      properties:
        document_id: { type: string }
        version:     { type: integer, minimum: 1 }
        page:        { type: integer, minimum: 1 }

  - name: fs.read
    description: "Read a file, or list a folder, in this task's scratch workspace."
    package: citadel_tools.fs
    side_effect: read
    required_capabilities: [workspace]
    classification_ceiling: internal
    requires_receipt: false
    schema:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path: { type: string, description: "Relative to the task workspace root" }

  - name: fs.write
    description: "Write a text file in this task's scratch workspace."
    package: citadel_tools.fs
    side_effect: write
    required_capabilities: [workspace]
    classification_ceiling: internal
    requires_receipt: false
    schema:
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        path:    { type: string }
        content: { type: string }

  - name: code.run
    description: "Run Python in the isolated sandbox (no network); workspace files are available and files it writes come back."
    package: citadel_tools.code
    side_effect: execute
    required_capabilities: [sandbox]
    classification_ceiling: internal
    requires_receipt: true            # sandbox boundary — the actual threat surface
    schema:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        source:     { type: string }
        timeout_s:  { type: integer, minimum: 1, maximum: 120, default: 30 }

  - name: sheet.read
    description: "Read an .xlsx or .csv file in the workspace as rows."
    package: citadel_tools.sheet
    side_effect: read
    required_capabilities: [workspace]
    classification_ceiling: internal
    requires_receipt: false
    schema:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:  { type: string }
        sheet: { type: string }

  - name: sheet.write
    description: 'Write cells (e.g. {"A1": 1}, or {"rows": [[...]]}) to an .xlsx or .csv in the workspace.'
    package: citadel_tools.sheet
    side_effect: write
    required_capabilities: [workspace]
    classification_ceiling: internal
    requires_receipt: false
    schema:
      type: object
      required: [path, cells]
      additionalProperties: false
      properties:
        path:  { type: string }
        sheet: { type: string }
        cells: { type: object }

  - name: vision.extract
    description: "Re-read a region of a scanned page with the vision model; returns a citable reading."
    package: citadel_tools.vision
    side_effect: read
    required_capabilities: [vision]
    classification_ceiling: confidential
    requires_receipt: true
    schema:
      type: object
      required: [document_id, page]
      additionalProperties: false
      properties:
        document_id: { type: string }
        page:        { type: integer, minimum: 1 }
        bbox:        { type: array, items: { type: number }, minItems: 4, maxItems: 4 }
    notes: |
      Re-reading a region only. Normal extraction happens at INGEST, not here
      (ADR-0001 Gap 2). On demo-local this call is budgeted as a model swap.

  - name: doc.generate
    description: "Fill a deliverable template with content (citations inline, e.g. [E2]) and run its four-tier verification."
    package: citadel_tools.doc
    side_effect: write
    required_capabilities: [doc_generation]
    classification_ceiling: confidential
    requires_receipt: true
    schema:
      type: object
      required: [template_id, content]
      additionalProperties: false
      properties:
        template_id: { type: string }
        content:     { type: object }
        citations:   { type: array, items: { type: object } }

  - name: calc.evaluate
    description: "Evaluate arithmetic with recorded working; returns the result and a citable C id."
    package: citadel_tools.calc
    side_effect: read
    required_capabilities: []
    # Raised from internal when the calculator was built: it is a pure, in-process
    # evaluator -- no files, no network, no sandbox -- whose only output is the working
    # it records as task evidence at the task's own classification. Capping it below the
    # corpus ceiling left CONFIDENTIAL tasks computing remaining life in a model's head,
    # which is exactly the ungrounded arithmetic this tool exists to remove. fs.*,
    # sheet.* and code.run stay at internal.
    classification_ceiling: confidential
    requires_receipt: false
    schema:
      type: object
      required: [expression]
      additionalProperties: false
      properties:
        expression: { type: string }
    notes: Retains displayable working. The working is part of the result, not a log line.

  - name: docs.diff
    description: "What changed between two issues of a document (defaults: the previous issue against the current one); each change comes with evidence ids for the old and the new wording."
    package: citadel_tools.docs
    side_effect: read
    required_capabilities: [retrieval]
    classification_ceiling: confidential
    requires_receipt: true
    schema:
      type: object
      required: [document_id]
      additionalProperties: false
      properties:
        document_id:  { type: string }
        from_version: { type: integer, minimum: 1 }
        to_version:   { type: integer, minimum: 1 }

  - name: web.search
    description: "Search the offline reference library -- vendor literature and technology digests imported through review; the air-gapped stand-in for a web search. Nothing leaves this machine."
    package: citadel_tools.docs
    side_effect: read
    required_capabilities: [retrieval]
    classification_ceiling: confidential
    requires_receipt: true
    options:
      within_folder: REFERENCE_LIBRARY
    schema:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1 }
        top_k: { type: integer, minimum: 1, maximum: 20, default: 6 }
    notes: |
      Deliberately NOT a web client: this deployment has no route out (invariant 10,
      target E). The reference library is a folder of PUBLIC documents a person imported
      and reviewed; this tool is confined to it by the options above. docs/adr/0010.

  - name: memory.recall
    description: "Recall what the workbench remembers from earlier tasks (facts, outcomes, rejections) about a subject. Memories guide where to look; cite documents, not memories, for facts."
    package: citadel_tools.memory_tool
    side_effect: read
    required_capabilities: [retrieval]
    classification_ceiling: confidential
    requires_receipt: false
    schema:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 1 }
        top_k: { type: integer, minimum: 1, maximum: 10, default: 5 }

  - name: workbench.inspect
    description: "Look at the workbench itself: your tasks, their agents and what each is doing or found, shared decisions and facts, recent activity. For questions about work in progress."
    package: citadel_tools.workbench
    side_effect: read
    required_capabilities: []
    classification_ceiling: confidential
    requires_receipt: false
    options:
      offered_in: [ask]      # a question about work in progress; a working task has no use for it
    schema:
      type: object
      additionalProperties: false
      properties:
        task: { type: string, description: "a task id or words from its title; omit for an overview" }

  - name: state.note
    description: "Record something in the task's shared state for the other agents and the people working on it: a fact (with evidence ids), a decision, an assumption, or a question for a person."
    package: citadel_tools.workbench
    side_effect: write
    required_capabilities: []
    classification_ceiling: confidential
    requires_receipt: false
    options:
      offered_in: [team]     # only where there are other agents (and people) to tell
    schema:
      type: object
      required: [kind, content]
      additionalProperties: false
      properties:
        kind:     { type: string, enum: [fact, decision, assumption, question] }
        content:  { type: string, minLength: 3, maxLength: 1200 }
        evidence: { type: array, items: { type: string } }
