# Policy rules. ORDERED. First match wins. DEFAULT DENY.
#
# The prototype had the right semantics in the wrong location: four hardcoded ordered
# rules inside a Python function, so a new tool or department meant a code change.
# Same evaluation point, same semantics, rules as data.
#
# Evaluated at the single chokepoint in packages/tools. Every decision — allow and
# deny alike — is an audit event.

rules:
  # --- hard denials first, so nothing below can accidentally re-permit them ---

  - id: deny-unknown-classification
    effect: deny
    reason: unknown_classification_not_comparable
    when:
      resource.classification: { not_in_lattice: true }
    notes: |
      An unrecognised marking is not comparable and therefore cannot be shown to be
      within clearance. Fail closed. This must stay first.

  - id: deny-above-clearance
    effect: deny
    reason: classification_exceeds_actor_max
    when:
      resource.classification: { exceeds: actor.classification_max }

  - id: deny-acl-disjoint
    effect: deny
    reason: acl_disjoint_from_department
    when:
      resource.acl: { disjoint_from: actor.department }   # singular -- matches citadel_contracts.domain.User.department: str; evaluator treats the scalar as a singleton set

  - id: deny-tool-ceiling
    effect: deny
    reason: tool_classification_ceiling_exceeded
    when:
      resource.classification: { exceeds: tool.classification_ceiling }

  - id: deny-missing-receipt
    effect: deny
    reason: receipt_required_and_absent_or_invalid
    when:
      tool.requires_receipt: true
      receipt.valid: false

  # --- capability grants ---

  - id: allow-read-with-capability
    effect: allow
    when:
      tool.side_effect: read
      actor.capabilities: { contains_all: tool.required_capabilities }

  - id: allow-write-with-capability
    effect: allow
    when:
      tool.side_effect: write
      actor.capabilities: { contains_all: tool.required_capabilities }

  - id: allow-execute-engineer
    effect: allow
    when:
      tool.side_effect: execute
      actor.role: { in: [engineer, admin] }
      actor.capabilities: { contains_all: tool.required_capabilities }

  # --- and if nothing matched ---
  # DEFAULT DENY. Not written as a rule, because a default that can be deleted
  # is not a default. It lives in the evaluator and there is a test for it.
