# Event vocabulary — OPEN by construction.
#
# The prototype closed this at sixteen types and rejected anything else, which is one
# of the named failure modes in the root AGENTS.md. Registration, never a closed enum.
#
# Adding an event type is an entry here. It is never a code change, and a type absent
# from this file is an unregistered-event error at startup, not a silent drop.

events:
  # --- governance ---
  - { name: policy.decision,      severity: info,    audit: true,  trace: true }
  - { name: policy.denial,        severity: warning, audit: true,  trace: true }
  - { name: identity.verified,    severity: info,    audit: true,  trace: false }
  - { name: identity.discarded,   severity: info,    audit: true,  trace: false }
  - { name: receipt.issued,       severity: info,    audit: true,  trace: true }
  - { name: receipt.rejected,     severity: warning, audit: true,  trace: true }

  # --- ingest & knowledge ---
  - { name: document.ingested,    severity: info,    audit: true,  trace: true }
  - { name: document.rejected,    severity: warning, audit: true,  trace: true }
  - { name: retrieval.performed,  severity: info,    audit: false, trace: true }
  - { name: retrieval.denied_doc, severity: info,    audit: true,  trace: true }

  # --- model & routing ---
  - { name: model.routed,         severity: info,    audit: true,  trace: true }
  - { name: model.fallback_used,  severity: warning, audit: true,  trace: true }
  - { name: model.degraded,       severity: warning, audit: true,  trace: true }
  - { name: model.swapped,        severity: info,    audit: false, trace: true }
  - { name: model.pull_requested, severity: info,    audit: true,  trace: true }   # a person started a download

  # --- task runtime ---
  - { name: task.submitted,       severity: info,    audit: true,  trace: true }
  - { name: task.planned,         severity: info,    audit: false, trace: true }
  - { name: task.replanned,       severity: info,    audit: false, trace: true }
  - { name: task.step_completed,  severity: info,    audit: false, trace: true }
  - { name: task.budget_exceeded, severity: warning, audit: true,  trace: true }
  - { name: task.cancelled,       severity: info,    audit: true,  trace: true }
  - { name: task.paused,          severity: info,    audit: true,  trace: true }   # a person paused every agent
  - { name: task.resumed,         severity: info,    audit: true,  trace: true }
  - { name: task.human_step,      severity: info,    audit: true,  trace: true }   # a person ran a tool on a task
  - { name: task.note_added,      severity: info,    audit: true,  trace: true }   # a fact/decision/steer in shared state
  - { name: task.draft_committed, severity: info,    audit: true,  trace: true }   # an editor draft became a task
  - { name: task.revision_requested, severity: info, audit: true, trace: true }   # the asker sent the deliverable back with an instruction

  # --- memory (the memory manager's six operations, plus a person's curation) ---
  - { name: memory.create,        severity: info,    audit: true,  trace: true }
  - { name: memory.update,        severity: info,    audit: true,  trace: true }
  - { name: memory.merge,         severity: info,    audit: true,  trace: true }
  - { name: memory.contradict,    severity: info,    audit: true,  trace: true }
  - { name: memory.archive,       severity: info,    audit: true,  trace: true }
  - { name: memory.restore,       severity: info,    audit: true,  trace: true }
  - { name: memory.edit,          severity: info,    audit: true,  trace: true }

  # --- deliverables ---
  - { name: artifact.generated,   severity: info,    audit: true,  trace: true }
  - { name: artifact.verified,    severity: info,    audit: true,  trace: true }
  - { name: artifact.failed_tier, severity: warning, audit: true,  trace: true }
  - { name: approval.requested,   severity: info,    audit: true,  trace: true }
  - { name: approval.accepted,    severity: info,    audit: true,  trace: true }
  - { name: approval.rejected,    severity: info,    audit: true,  trace: true }
  - { name: artifact.released,    severity: info,    audit: true,  trace: true }
  - { name: artifact.edited,      severity: info,    audit: true,  trace: true }   # a person edited a deliverable; re-verified as a new version

  # --- sovereignty ---
  - { name: egress.attempt,       severity: warning, audit: true,  trace: true }
  - { name: egress.blocked,       severity: warning, audit: true,  trace: true }
  - { name: dns.denied,           severity: warning, audit: true,  trace: true }
  - { name: sovereignty.probe,    severity: info,    audit: true,  trace: true }   # the deliberate probe was run
