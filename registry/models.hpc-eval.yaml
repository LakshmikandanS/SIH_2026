# Model registry — hpc-eval profile (university HPC, NVIDIA DGX-H200, vLLM)
#
# THIS PROFILE IS A MEASURING INSTRUMENT, NOT THE PRODUCT. See ADR-0003.
# Never sovereign. Never confidential material. Never on the demonstration path.
#
# NOTHING IS PULLED AUTOMATICALLY. Every entry is `enabled: false` pending approval.
# Tags are CANDIDATES — confirm exact HF ids and tensor-parallel sizing before enabling.
#
# Hardware: H200 = Hopper, sm_90, 141 GB HBM3e per card. vLLM's best-supported target;
# none of the Blackwell wheel problems that shape the demo-local profile apply here.
# A ~250 GB allocation is 2 cards, so entries below assume tensor_parallel_size: 2.
#
# The registry keeps the SAME SHAPE as demo-local on purpose. If this file needed
# extra fields, the profile abstraction would be leaking and that is a bug to chase.

models:
  - id: reason-general
    enabled: false
    tag: "Qwen/Qwen3-32B"                     # CANDIDATE
    runtime: vllm
    modalities: [text]
    capabilities: [reasoning, planning, tool_calling, structured_output, drafting]
    context_window: 131072
    vram_gb: 65
    quality_tier: high
    classification_ceiling: public            # capped by the profile; see profiles.yaml
    resident: true
    fallback: [reason-code]

  - id: reason-code
    enabled: false
    tag: "Qwen/Qwen2.5-Coder-32B-Instruct"    # CANDIDATE
    runtime: vllm
    modalities: [text]
    capabilities: [code_generation, tool_calling, structured_output]
    context_window: 131072
    vram_gb: 65
    quality_tier: high
    classification_ceiling: public
    resident: true
    fallback: [reason-general]

  - id: vision-doc
    enabled: false
    tag: "Qwen/Qwen2.5-VL-32B-Instruct"       # CANDIDATE
    runtime: vllm
    modalities: [text, image]
    capabilities: [vision, ocr_assist, figure_reading, stamped_field_extraction]
    context_window: 32768
    vram_gb: 65
    quality_tier: high
    classification_ceiling: public
    resident: true                            # no swapping on this profile
    fallback: []

  - id: embed-text
    enabled: false
    tag: "BAAI/bge-m3"                        # CANDIDATE
    runtime: vllm
    modalities: [text]
    capabilities: [embedding]
    context_window: 8192
    vram_gb: 2.5
    quality_tier: high
    classification_ceiling: public
    resident: true
    fallback: []

  # --- evaluation-only. Has no counterpart in demo-local, and must never acquire one. ---
  - id: judge
    enabled: false
    tag: "Qwen/Qwen3-72B-Instruct"            # CANDIDATE
    runtime: vllm
    modalities: [text]
    capabilities: [rubric_grading]
    context_window: 131072
    vram_gb: 145
    quality_tier: reference
    classification_ceiling: public
    resident: false
    fallback: []
    notes: |
      Grades the eval harness's 20-task rubric suite (ADR-0003 §4). Rubric-grading
      several candidate models by hand does not scale and therefore will not get done;
      a judge model is what makes the suite runnable in CI.

      It is NOT routable. The router must never select it for a user task — it has a
      capability (`rubric_grading`) that no task ever requires. If it is ever reachable
      from the agent loop, that is a bug: an evaluation grader in the product path
      measures nothing and costs everything.
