[project]
name = "citadel-api"
version = "0.0.0"
description = "The HTTP API, the SSE task streams and the web UI."
requires-python = ">=3.12"

# starlette/uvicorn are real runtime dependencies now, not an assumption that they
# happen to be pre-installed wherever this runs -- see citadel_api's own module
# docstring for why they're Starlette/uvicorn rather than FastAPI/hypercorn.
dependencies = [
    "citadel-contracts",
    "citadel-platform",
    "citadel-gateway",
    "citadel-knowledge",
    "citadel-deliverables",
    "citadel-tools",
    "citadel-runtime",
    "citadel-sovereignty",
    "starlette>=0.38,<2",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9",
    "cryptography>=42,<45",
]

# uv_build ships with uv, so building this package needs no network.
# setuptools would have to be fetched from PyPI for every build, which
# breaks the offline-build requirement (handoff 3.2). See PLAN-M0 task 14.
[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"


[tool.uv.sources]
citadel-contracts = { workspace = true }
citadel-platform = { workspace = true }
citadel-gateway = { workspace = true }
citadel-knowledge = { workspace = true }
citadel-deliverables = { workspace = true }
citadel-tools = { workspace = true }
citadel-runtime = { workspace = true }
citadel-sovereignty = { workspace = true }
