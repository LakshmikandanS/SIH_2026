[project]
name = "citadel-sandbox"
version = "0.0.0"
description = "The sandbox service: verifies code.run receipts, then executes in an isolated process."
requires-python = ">=3.12"

dependencies = [
    "citadel-contracts",
    "citadel-platform",
    "citadel-tools",
    "citadel-sovereignty",
    "starlette>=0.38,<2",   # same range as services/api: one resolution for the workspace
    "uvicorn>=0.30,<1",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
citadel-contracts = { workspace = true }
citadel-platform = { workspace = true }
citadel-tools = { workspace = true }
citadel-sovereignty = { workspace = true }
